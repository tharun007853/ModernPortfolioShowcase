name: tharun-portfolio
services:
- name: web
  source_dir: /
  github:
    repo: your-username/portfolio-website
    branch: main
  run_command: npm start
  environment_slug: node-js
  instance_count: 1
  instance_size_slug: basic-xxs
  http_port: 5000
  health_check:
    http_path: /
  envs:
  - key: NODE_ENV
    value: production